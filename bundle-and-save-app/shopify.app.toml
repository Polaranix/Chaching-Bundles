# This file stores configuration for your Shopify app.

name = "bundle-and-save"
client_id = "your_api_key_here"
application_url = "https://your-app-url.com"
embedded = true

[access_scopes]
# Add the scopes your app needs. Learn more: https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,read_orders,write_discounts"

[auth]
redirect_urls = [
  "https://your-app-url.com/auth/callback",
  "https://your-app-url.com/auth/shopify/callback",
  "https://your-app-url.com/api/auth/callback"
]

[webhooks]
api_version = "2023-10"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-dev-store.myshopify.com"
include_config_on_deploy = true
