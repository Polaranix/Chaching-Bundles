[package]
name = "bundle-discount"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
shopify_function = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "bundle-discount"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "s"
strip = true
